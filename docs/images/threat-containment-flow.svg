<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%">
  <defs>
    <filter id="fShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="920" height="380" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="40" y="44" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Threat Containment &amp; Process Attribution Flow</text>
  <text x="40" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Lifecycle of an intercepted link-local IMDS request inside the Linux kernel and userspace daemon</text>

  <!-- Step 1: Rogue Process -->
  <g transform="translate(40, 95)" filter="url(#fShadow)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="26" rx="8" fill="#3c1e24" />
    <text x="80" y="18" fill="#ff7b72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Rogue Process</text>
    <text x="80" y="52" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" text-anchor="middle">PID: 4912 (curl)</text>
    <text x="80" y="72" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">UID 33 (www-data)</text>
    <text x="80" y="94" fill="#f85149" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">connect(169.254...)</text>
  </g>

  <!-- Arrow 1 to Kernel Hook -->
  <line x1="200" y1="150" x2="250" y2="150" stroke="#f85149" stroke-width="2" marker-end="url(#redArrow)" />

  <!-- Step 2: Linux Kernel eBPF Hook -->
  <g transform="translate(260, 95)" filter="url(#fShadow)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#1c2d42" />
    <text x="100" y="18" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">eBPF Kernel Hook</text>
    <text x="100" y="52" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">SEC("cgroup/connect4")</text>
    <text x="100" y="72" fill="#79c0ff" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Rewrite to 127.0.0.1:18080</text>
    <text x="100" y="94" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">bpf_ringbuf_submit()</text>
  </g>

  <!-- Arrow 2 to Attribution Engine & Honeypot -->
  <path d="M 460 135 L 500 135 L 500 120 L 530 120" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 460 165 L 500 165 L 500 180 L 530 180" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#greenArrow)" />

  <!-- Step 3A: Attribution Engine -->
  <g transform="translate(540, 80)" filter="url(#fShadow)">
    <rect x="0" y="0" width="190" height="85" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.2" />
    <text x="95" y="22" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Attribution Engine</text>
    <text x="95" y="44" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Scrapes /proc/4912/exe</text>
    <text x="95" y="60" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Extracts args &amp; parent tree</text>
    <text x="95" y="76" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Evaluates Allowlist Rules</text>
  </g>

  <!-- Step 3B: Deceptive Honeypot -->
  <g transform="translate(540, 180)" filter="url(#fShadow)">
    <rect x="0" y="0" width="190" height="75" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.2" />
    <text x="95" y="22" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HTTP Honeypot Server</text>
    <text x="95" y="44" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">127.0.0.1:18080 (IMDSv1/v2)</text>
    <text x="95" y="62" fill="#e3b341" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Vends Canary AWS Credentials</text>
  </g>

  <!-- Step 4: Actions & Containment Modes -->
  <g transform="translate(760, 80)" filter="url(#fShadow)">
    <rect x="0" y="0" width="150" height="235" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="26" rx="8" fill="#21262d" />
    <text x="75" y="18" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Response Modes</text>

    <!-- Mode 1 -->
    <rect x="10" y="36" width="130" height="50" rx="4" fill="#1c2128" stroke="#f85149" stroke-width="0.8" />
    <text x="75" y="54" fill="#ff7b72" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" text-anchor="middle">-containment sigkill</text>
    <text x="75" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">Terminates rogue PID</text>

    <!-- Mode 2 -->
    <rect x="10" y="96" width="130" height="50" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="0.8" />
    <text x="75" y="114" fill="#e3b341" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" text-anchor="middle">-containment sigstop</text>
    <text x="75" y="134" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">Freezes PID for forensics</text>

    <!-- Mode 3 -->
    <rect x="10" y="156" width="130" height="66" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="0.8" />
    <text x="75" y="174" fill="#79c0ff" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" text-anchor="middle">-containment monitor</text>
    <text x="75" y="192" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">Silent honeytoken trap</text>
    <text x="75" y="208" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">+ SIEM / Slack webhook</text>
  </g>

  <!-- Connectors from 3A to 4 -->
  <line x1="730" y1="120" x2="760" y2="120" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Bottom Flow Bar -->
  <rect x="40" y="325" width="870" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="60" cy="345" r="5" fill="#3fb950" />
  <text x="75" y="349" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Zero Kernel Overhead:</text>
  <text x="215" y="349" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">eBPF execution completes in &lt; 2µs; process inspection &amp; webhook dispatch occur asynchronously via non-blocking ring buffer.</text>
</svg>
