<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%">
  <defs>
    <filter id="dashShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dashboard Container -->
  <g filter="url(#dashShadow)">
    <rect x="20" y="20" width="900" height="400" rx="10" fill="#111217" stroke="#22252b" stroke-width="1.5" />

    <!-- Grafana Top Navbar -->
    <rect x="20" y="20" width="900" height="42" rx="10" fill="#181b1f" />
    <circle cx="44" cy="41" r="10" fill="#ff7800" />
    <text x="44" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" text-anchor="middle">G</text>
    <text x="66" y="46" fill="#d8d9da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">imds-canary / Security Operations Telemetry</text>

    <!-- Range Pill -->
    <rect x="790" y="31" width="110" height="20" rx="4" fill="#22252b" stroke="#373b42" stroke-width="0.8" />
    <text x="845" y="45" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Last 30 mins ▾</text>
  </g>

  <!-- Metric Gauges Row -->
  <!-- Stat Card 1 -->
  <g transform="translate(40, 78)">
    <rect x="0" y="0" width="200" height="94" rx="6" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="14" y="24" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">TOTAL INTERCEPTIONS</text>
    <text x="14" y="62" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="bold">142</text>
    <text x="14" y="82" fill="#3fb950" font-family="ui-monospace, monospace" font-size="10">▲ 12 this hour</text>
  </g>

  <!-- Stat Card 2 -->
  <g transform="translate(260, 78)">
    <rect x="0" y="0" width="200" height="94" rx="6" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="14" y="24" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">CONTAINMENTS (SIGKILL)</text>
    <text x="14" y="62" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="bold">9</text>
    <text x="14" y="82" fill="#f85149" font-family="ui-monospace, monospace" font-size="10">100% neutralized</text>
  </g>

  <!-- Stat Card 3 -->
  <g transform="translate(480, 78)">
    <rect x="0" y="0" width="200" height="94" rx="6" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="14" y="24" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">HOOK LATENCY (P99)</text>
    <text x="14" y="62" fill="#a371f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="bold">1.4 ms</text>
    <text x="14" y="82" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="10">BPF ringbuf: 0 drops</text>
  </g>

  <!-- Stat Card 4 -->
  <g transform="translate(700, 78)">
    <rect x="0" y="0" width="200" height="94" rx="6" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="14" y="24" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">ALLOWLISTED PROCESSES</text>
    <text x="14" y="62" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="bold">3,892</text>
    <text x="14" y="82" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="10">amazon-ssm-agent, aws-cli</text>
  </g>

  <!-- Time Series Graph 1: Interceptions Over Time -->
  <g transform="translate(40, 190)">
    <rect x="0" y="0" width="420" height="210" rx="6" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="16" y="24" fill="#d8d9da" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">IMDS Interceptions by Process Comm</text>

    <!-- Grid lines -->
    <line x1="40" y1="50" x2="400" y2="50" stroke="#252930" stroke-width="0.8" />
    <line x1="40" y1="90" x2="400" y2="90" stroke="#252930" stroke-width="0.8" />
    <line x1="40" y1="130" x2="400" y2="130" stroke="#252930" stroke-width="0.8" />
    <line x1="40" y1="170" x2="400" y2="170" stroke="#252930" stroke-width="0.8" />

    <!-- Waveform: curl -->
    <path d="M 40 170 Q 100 160, 140 140 T 220 80 T 300 130 T 400 60" fill="none" stroke="#f85149" stroke-width="2.5" />
    <!-- Waveform: python3 -->
    <path d="M 40 170 Q 120 168, 180 155 T 260 120 T 340 145 T 400 110" fill="none" stroke="#e3b341" stroke-width="2" />
    <!-- Waveform: allowed ssm-agent -->
    <path d="M 40 110 Q 120 100, 200 115 T 300 105 T 400 95" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Legend -->
    <circle cx="50" cy="195" r="4" fill="#f85149" />
    <text x="60" y="198" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="10">curl (unauthorized)</text>
    <circle cx="180" cy="195" r="4" fill="#e3b341" />
    <text x="190" y="198" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="10">python3</text>
    <circle cx="280" cy="195" r="4" fill="#58a6ff" />
    <text x="290" y="198" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="10">ssm-agent (allowlisted)</text>
  </g>

  <!-- Process Breakdown Bar Chart -->
  <g transform="translate(480, 190)">
    <rect x="0" y="0" width="420" height="210" rx="6" fill="#181b1f" stroke="#22252b" stroke-width="1" />
    <text x="16" y="24" fill="#d8d9da" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Top Detected Callers (/proc/&lt;pid&gt;/exe)</text>

    <!-- Bars -->
    <text x="16" y="60" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="11">/usr/bin/curl</text>
    <rect x="150" y="48" width="180" height="15" rx="3" fill="#f85149" />
    <text x="340" y="60" fill="#f85149" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">78</text>

    <text x="16" y="95" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="11">/usr/bin/python3</text>
    <rect x="150" y="83" width="110" height="15" rx="3" fill="#e3b341" />
    <text x="270" y="95" fill="#e3b341" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">42</text>

    <text x="16" y="130" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="11">/bin/nc.traditional</text>
    <rect x="150" y="118" width="45" height="15" rx="3" fill="#ff7b72" />
    <text x="205" y="130" fill="#ff7b72" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">14</text>

    <text x="16" y="165" fill="#8e8e93" font-family="ui-monospace, monospace" font-size="11">/usr/bin/wget</text>
    <rect x="150" y="153" width="24" height="15" rx="3" fill="#d29922" />
    <text x="184" y="165" fill="#d29922" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">8</text>

    <rect x="16" y="185" width="388" height="18" rx="3" fill="#22252b" />
    <text x="210" y="198" fill="#3fb950" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">✓ Prometheus Endpoint Active: http://127.0.0.1:9090/metrics</text>
  </g>
</svg>
