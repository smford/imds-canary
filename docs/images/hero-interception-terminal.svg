      <tspan fill="#50fa7b" font-weight="bold">root@ec2-prod</tspan><tspan fill="#6272a4">:</tspan><tspan fill="#8be9fd">~#</tspan>
      <tspan fill="#f8f8f2"> imds-canary -port 18080 -containment sigkill -webhook-url https://hooks.slack.com/services/...</tspan>
    </text>

    <!-- Startup Banner -->
    <text x="45" y="122" fill="#bd93f9" font-weight="bold">imds-canary 0.1.0</text>
    <text x="180" y="122" fill="#6272a4">(commit: 2713cf6, date: 2026-10-24T01:45:00Z)</text>
    <text x="45" y="140" fill="#6272a4">Copyright (c) 2026 smford | MIT License | Linux 6.5.0-x86_64</text>

    <!-- Daemon Init Logs -->
    <text x="45" y="168" fill="#8be9fd">2026/10/24 02:30:10</text>
    <text x="195" y="168" fill="#50fa7b">[INFO]</text>
    <text x="250" y="168" fill="#ff79c6">[BPF]</text>
    <text x="300" y="168" fill="#f8f8f2">Compiling &amp; loading cgroup/connect4 hook (CO-RE enabled)...</text>

    <text x="45" y="188" fill="#8be9fd">2026/10/24 02:30:10</text>
    <text x="195" y="188" fill="#50fa7b">[INFO]</text>
    <text x="250" y="188" fill="#ff79c6">[BPF]</text>
    <text x="300" y="188" fill="#50fa7b">Attached to /sys/fs/cgroup. Transparently redirecting 169.254.169.254:80 -> 127.0.0.1:18080</text>

    <text x="45" y="208" fill="#8be9fd">2026/10/24 02:30:10</text>
    <text x="195" y="188" fill="#50fa7b"></text>
    <text x="250" y="208" fill="#f1fa8c">[HONEYPOT]</text>
    <text x="340" y="208" fill="#f8f8f2">Vending Canarytokens for IAM role: &quot;prod-backend-role&quot; (Canary ID: AKIA-TRIPWIRE-9142)</text>

    <text x="45" y="228" fill="#8be9fd">2026/10/24 02:30:10</text>
    <text x="195" y="228" fill="#50fa7b">[INFO]</text>
    <text x="250" y="228" fill="#bd93f9">[METRICS]</text>
    <text x="330" y="228" fill="#f8f8f2">Prometheus metrics exporter initialized at :9090/metrics</text>

    <!-- Interception Event Box -->
    <rect x="42" y="252" width="856" height="236" rx="8" fill="#1e1f29" stroke="#ff5555" stroke-width="1.2" opacity="0.95" />
    <rect x="42" y="252" width="856" height="28" rx="8" fill="#2d1d29" />
    <circle cx="62" cy="266" r="4.5" fill="#ff5555" />
    <text x="76" y="270" fill="#ff5555" font-weight="bold">🚨 ALERT: ROGUE IMDS THEFT ATTEMPT INTERCEPTED BY KERNEL HOOK</text>
    <text x="760" y="270" fill="#ff79c6" font-size="11">LATENCY: 180µs</text>

    <!-- Attribution Forensics Details -->
    <text x="60" y="304" fill="#6272a4">Process ID:     </text><text x="180" y="304" fill="#f1fa8c" font-weight="bold">4912</text><text x="260" y="304" fill="#6272a4">(Comm: curl, UID: 33 [www-data], GID: 33)</text>
    <text x="60" y="324" fill="#6272a4">Executable:     </text><text x="180" y="324" fill="#50fa7b">/usr/bin/curl</text>
    <text x="60" y="344" fill="#6272a4">Full Cmdline:   </text><text x="180" y="344" fill="#f8f8f2">curl -s -m 2 http://169.254.169.254/latest/meta-data/iam/security-credentials/prod-role</text>
    <text x="60" y="364" fill="#6272a4">Working Dir:    </text><text x="180" y="364" fill="#8be9fd">/var/www/vulnerable-api</text>
    <text x="60" y="384" fill="#6272a4">Ancestry Tree:  </text><text x="180" y="384" fill="#ff79c6">systemd (1) ➔ gunicorn (4102) ➔ python3 server.py (4890) ➔ curl (4912)</text>
    <text x="60" y="404" fill="#6272a4">Canary Vended:  </text><text x="180" y="404" fill="#bd93f9">AccessKeyId=&quot;AKIA-TRIPWIRE-9142&quot; (Token dispatched; CloudTrail tripwire primed)</text>

    <!-- Containment Action Line -->
    <rect x="58" y="420" width="824" height="28" rx="4" fill="#3a1c22" stroke="#ff5555" stroke-width="0.8" />
    <text x="70" y="438" fill="#ff5555" font-weight="bold">⚡ CONTAINMENT: </text>
    <text x="190" y="438" fill="#f8f8f2">Signal SIGKILL delivered to PID 4912. Process terminated before payload exfiltration.</text>

