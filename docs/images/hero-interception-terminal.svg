    <text x="220" y="468" fill="#f8f8f2">Slack incident channel alerted (HMAC-SHA256 signature verified, HTTP 200 OK)</text>

    <!-- Ready prompt -->
    <text x="45" y="514">
      <tspan fill="#50fa7b" font-weight="bold">root@ec2-prod</tspan><tspan fill="#6272a4">:</tspan><tspan fill="#8be9fd">~#</tspan>
      <tspan fill="#f8f8f2"> _</tspan>
    </text>
