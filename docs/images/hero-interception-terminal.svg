<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282a36" />
      <stop offset="100%" stop-color="#1e1f29" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161821" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>
  </defs>

  <!-- Terminal Window Background with Shadow -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="900" height="520" rx="12" fill="url(#bodyGrad)" stroke="#383c4a" stroke-width="1.5" />
    <!-- Titlebar -->
    <path d="M 20 32 A 12 12 0 0 1 32 20 L 908 20 A 12 12 0 0 1 920 32 L 920 62 L 20 62 Z" fill="url(#headerGrad)" stroke="#383c4a" stroke-width="1.5" />
    <!-- Window Control Buttons -->
    <circle cx="44" cy="41" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="66" cy="41" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="88" cy="41" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
    <!-- Window Title -->
    <text x="470" y="45" fill="#9da5b4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">root@ec2-prod-web01: ~/imds-canary (cgroup: /sys/fs/cgroup)</text>
    <!-- Badge -->
    <rect x="800" y="32" width="104" height="18" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="852" y="45" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle">eBPF ACTIVE</text>
  </g>

