name: DAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Mondays at 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zap_scan:
    name: OWASP ZAP Baseline DAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build local container image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          load: true
          tags: imds-canary-dast:local

      - name: Start service daemon
        run: |
          docker run -d --name imds-canary-daemon -p 18080:18080 imds-canary-dast:local -dry-run -port 18080 -bind 0.0.0.0

      - name: Await daemon readiness (/healthz)
        run: |
          echo "Awaiting imds-canary daemon readiness..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:18080/healthz > /dev/null; then
              echo "Daemon ready after ${i} seconds"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout: imds-canary daemon failed to report healthy on /healthz" >&2
          docker logs imds-canary-daemon
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: 'http://localhost:18080'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false

      - name: Stop and cleanup container
        if: always()
        run: |
          docker stop imds-canary-daemon || true
          docker rm imds-canary-daemon || true
