version: 2

project_name: imds-canary

before:
  hooks:
    - go mod tidy

builds:
  - id: imds-canary
    main: ./cmd/imds-canary
    binary: imds-canary
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/smford/imds-canary/internal/version.Version={{.Version}} -X github.com/smford/imds-canary/internal/version.Commit={{.Commit}} -X github.com/smford/imds-canary/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

release:
  github:
    owner: smford
    name: imds-canary
  draft: false
  prerelease: auto
  mode: replace
  replace_existing_artifacts: true
